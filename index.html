<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1419">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Учёт обращений</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface2: #243044;
      --border: #2d3f56;
      --text: #e8edf4;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --wa: #25d366;
      --radius: 10px;
      --font: "Segoe UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 110px;
      padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px));
    }

    header { margin-bottom: 20px; }
    header h1 { font-size: 1.35rem; font-weight: 600; }
    header p { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }

    .panel h2 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="date"],
    select {
      width: 100%;
      padding: 14px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font: inherit;
      font-size: 16px;
      margin-bottom: 12px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .chip-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .chip {
      padding: 12px 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      min-height: 44px;
    }

    .chip:active { border-color: var(--accent); background: rgba(59, 130, 246, 0.15); }

    .btn {
      padding: 14px 18px;
      border: none;
      border-radius: 8px;
      font: inherit;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      min-height: 48px;
    }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:active { background: var(--accent-hover); }

    .btn-wa { background: var(--wa); color: #fff; }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 8px 12px;
      font-size: 0.8rem;
      width: auto;
      min-height: auto;
    }

    .report-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .report-preview {
      padding: 12px;
      background: var(--surface2);
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
      max-height: 200px;
      overflow-y: auto;
    }

    .record-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      padding: 12px;
      background: var(--surface2);
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .record-item strong { color: var(--accent); font-weight: 500; }

    .empty { color: var(--muted); text-align: center; padding: 20px; font-size: 0.9rem; }

    .manager-new { display: none; margin-top: -4px; margin-bottom: 12px; }
    .manager-new.visible { display: block; }

    details { margin-top: 12px; font-size: 0.85rem; color: var(--muted); }
    details summary { cursor: pointer; padding: 8px 0; }

    .managers-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }

    .manager-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--surface2);
      border-radius: 6px;
      font-size: 0.8rem;
      color: var(--text);
    }

    .manager-chip button {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 0;
    }

    .add-row { display: flex; gap: 8px; }
    .add-row input { margin-bottom: 0; flex: 1; }
    .add-row .btn { width: auto; white-space: nowrap; padding: 10px 14px; min-height: 44px; }

    .panel-foot {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }

    .sticky-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      padding: 10px 16px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(transparent, var(--bg) 15%, var(--bg));
      border-top: 1px solid var(--border);
      max-width: 480px;
      margin: 0 auto;
    }

    .toast {
      position: fixed;
      bottom: calc(76px + env(safe-area-inset-bottom, 0px));
      left: 16px;
      right: 16px;
      max-width: 448px;
      margin: 0 auto;
      padding: 12px;
      background: #22c55e;
      color: #fff;
      border-radius: 8px;
      text-align: center;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Учёт обращений</h1>
      <p>Запись → отчёт в WhatsApp</p>
    </header>

    <section class="panel">
      <h2>Новая запись</h2>
      <form id="recordForm">
        <label for="managerSelect">Менеджер</label>
        <select id="managerSelect" required></select>
        <div class="manager-new" id="managerNewWrap">
          <input type="text" id="managerNew" placeholder="Имя менеджера">
        </div>

        <label for="whyText">Почему ушли / что спрашивали</label>
        <input type="text" id="whyText" placeholder="Например: не устроила цена" required>

        <div class="chip-grid" id="reasonChips">
          <button type="button" class="chip" data-text="Не устроила цена">Дорого</button>
          <button type="button" class="chip" data-text="Узнал цену / сроки">Цена / сроки</button>
          <button type="button" class="chip" data-text="Просто посмотреть">Подумает</button>
          <button type="button" class="chip" data-text="Нет запчасти">Нет запчасти</button>
          <button type="button" class="chip" data-text="Долго ждать">Долго ждать</button>
          <button type="button" class="chip" data-text="Сравнивает с конкурентами">Конкуренты</button>
        </div>

        <button type="submit" class="btn btn-primary">Сохранить</button>
      </form>

      <details>
        <summary>Менеджеры</summary>
        <div class="managers-list" id="managersList"></div>
        <div class="add-row">
          <input type="text" id="addManagerInput" placeholder="Имя">
          <button type="button" class="btn btn-secondary" id="addManagerBtn">+</button>
        </div>
      </details>
    </section>

    <section class="panel">
      <h2>Отчёт за день</h2>
      <label for="reportDate">Дата</label>
      <input type="date" id="reportDate">
      <pre class="report-preview" id="reportPreview"></pre>
      <div class="report-actions">
        <button type="button" class="btn btn-wa" id="whatsappBtn">WhatsApp</button>
        <button type="button" class="btn btn-secondary" id="copyReportBtn">Копировать</button>
      </div>
    </section>

    <section class="panel">
      <h2>Записи за день</h2>
      <div id="recordsList"></div>
      <div class="panel-foot">
        <button type="button" class="btn btn-danger" id="clearDayBtn">Очистить день</button>
      </div>
    </section>
  </div>

  <div class="sticky-bar">
    <div class="report-actions">
      <button type="button" class="btn btn-wa" id="whatsappBtn2">WhatsApp</button>
      <button type="button" class="btn btn-secondary" id="copyReportBtn2">Копировать</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = 'repair_visits_v1';
    const MANAGERS_KEY = 'repair_managers_v1';
    const LAST_MANAGER_KEY = 'repair_last_manager';

    let records = loadRecords();
    let managers = loadManagers();

    function normalizeRecord(r) {
      if (r.text) return r;
      const text = ((r.comment || '').trim() || r.reason || '').trim();
      return {
        id: r.id || crypto.randomUUID(),
        manager: r.manager || '',
        date: r.date,
        text,
        createdAt: r.createdAt || new Date().toISOString()
      };
    }

    function loadRecords() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const list = raw ? JSON.parse(raw) : [];
        return list.map(normalizeRecord).filter(r => r.text);
      } catch {
        return [];
      }
    }

    function saveRecords() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function loadManagers() {
      try {
        const raw = localStorage.getItem(MANAGERS_KEY);
        const list = raw ? JSON.parse(raw) : [];
        records.forEach(r => {
          if (r.manager && !list.includes(r.manager)) list.push(r.manager);
        });
        return [...new Set(list)].sort((a, b) => a.localeCompare(b, 'ru'));
      } catch {
        return [];
      }
    }

    function saveManagers() {
      localStorage.setItem(MANAGERS_KEY, JSON.stringify(managers));
    }

    function todayStr() {
      return new Date().toISOString().slice(0, 10);
    }

    function formatDate(iso) {
      const [y, m, d] = iso.split('-');
      return `${d}.${m}.${y}`;
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function getDayData(dateStr) {
      return records.filter(r => r.date === dateStr);
    }

    function buildDailyReport(dateStr) {
      const data = getDayData(dateStr);
      const total = data.length;

      if (!total) {
        return `Отчёт за ${formatDate(dateStr)}\n\nЗа этот день записей нет.`;
      }

      const mgrs = [...new Set(data.map(r => r.manager).filter(Boolean))];
      const sorted = [...data].sort((a, b) =>
        (a.createdAt || '').localeCompare(b.createdAt || '')
      );

      let text = `Отчёт за ${formatDate(dateStr)}\n\n`;
      text += `Всего обращений: ${total}\n`;
      text += `Менеджеры: ${mgrs.join(', ') || '—'}\n`;
      text += `\nПочему ушли\n`;
      sorted.forEach((r, i) => {
        text += `• ${i + 1} ${r.text}\n`;
      });

      return text.trim();
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function renderManagerSelect() {
      const sel = document.getElementById('managerSelect');
      const last = localStorage.getItem(LAST_MANAGER_KEY) || '';
      sel.innerHTML = `
        <option value="">— менеджер —</option>
        ${managers.map(m => `<option value="${escapeHtml(m)}"${m === last ? ' selected' : ''}>${escapeHtml(m)}</option>`).join('')}
        <option value="__new__">+ Новый</option>
      `;
      document.getElementById('managerNewWrap').classList.toggle('visible', sel.value === '__new__');

      document.getElementById('managersList').innerHTML = managers.length
        ? managers.map(m => `
            <span class="manager-chip">${escapeHtml(m)}
              <button type="button" onclick="removeManager(${JSON.stringify(m)})">&times;</button>
            </span>
          `).join('')
        : '<span style="color:var(--muted)">Добавьте менеджера</span>';
    }

    window.removeManager = function(name) {
      if (!confirm(`Убрать «${name}» из списка?`)) return;
      managers = managers.filter(m => m !== name);
      saveManagers();
      renderManagerSelect();
    };

    function getManagerFromForm() {
      const sel = document.getElementById('managerSelect').value;
      if (sel === '__new__') return document.getElementById('managerNew').value.trim();
      return sel;
    }

    function ensureManager(name) {
      if (!name) return;
      if (!managers.includes(name)) {
        managers.push(name);
        managers.sort((a, b) => a.localeCompare(b, 'ru'));
        saveManagers();
      }
      localStorage.setItem(LAST_MANAGER_KEY, name);
    }

    function updateReport() {
      const dateStr = document.getElementById('reportDate').value || todayStr();
      document.getElementById('reportPreview').textContent = buildDailyReport(dateStr);
    }

    function renderRecords() {
      const dateStr = document.getElementById('reportDate').value || todayStr();
      const data = getDayData(dateStr).sort((a, b) =>
        (b.createdAt || '').localeCompare(a.createdAt || '')
      );
      const el = document.getElementById('recordsList');

      if (!data.length) {
        el.innerHTML = '<div class="empty">Нет записей</div>';
        return;
      }

      el.innerHTML = data.map(r => `
        <div class="record-item">
          <div><strong>${escapeHtml(r.manager)}</strong> — ${escapeHtml(r.text)}</div>
          <button type="button" class="btn btn-danger" onclick="deleteRecord('${r.id}')">×</button>
        </div>
      `).join('');
    }

    function render() {
      updateReport();
      renderRecords();
    }

    window.deleteRecord = function(id) {
      if (!confirm('Удалить запись?')) return;
      records = records.filter(r => r.id !== id);
      saveRecords();
      render();
    };

    async function copyReport() {
      const dateStr = document.getElementById('reportDate').value || todayStr();
      const text = buildDailyReport(dateStr);
      if (!getDayData(dateStr).length) {
        alert('За этот день записей нет');
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
        showToast('Скопировано');
      } catch {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('Скопировано');
      }
    }

    function sendWhatsApp() {
      const dateStr = document.getElementById('reportDate').value || todayStr();
      const text = buildDailyReport(dateStr);
      if (!getDayData(dateStr).length) {
        alert('За этот день записей нет');
        return;
      }
      window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
    }

    document.getElementById('reportDate').value = todayStr();
    renderManagerSelect();

    document.getElementById('managerSelect').addEventListener('change', function() {
      document.getElementById('managerNewWrap').classList.toggle('visible', this.value === '__new__');
    });

    document.getElementById('reasonChips').addEventListener('click', function(e) {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      document.getElementById('whyText').value = chip.dataset.text;
      document.getElementById('whyText').focus();
    });

    document.getElementById('recordForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const manager = getManagerFromForm();
      const text = document.getElementById('whyText').value.trim();
      if (!manager) { alert('Выберите менеджера'); return; }
      if (!text) { alert('Напишите, почему ушли'); return; }

      ensureManager(manager);
      const dateStr = document.getElementById('reportDate').value || todayStr();

      records.push({
        id: crypto.randomUUID(),
        manager,
        date: dateStr,
        text,
        createdAt: new Date().toISOString()
      });

      saveRecords();
      renderManagerSelect();
      document.getElementById('managerSelect').value = manager;
      document.getElementById('whyText').value = '';
      showToast('Сохранено');
      render();
    });

    document.getElementById('addManagerBtn').addEventListener('click', function() {
      const name = document.getElementById('addManagerInput').value.trim();
      if (!name) return;
      ensureManager(name);
      document.getElementById('addManagerInput').value = '';
      renderManagerSelect();
      document.getElementById('managerSelect').value = name;
    });

    document.getElementById('reportDate').addEventListener('change', render);
    document.getElementById('copyReportBtn').addEventListener('click', copyReport);
    document.getElementById('copyReportBtn2').addEventListener('click', copyReport);
    document.getElementById('whatsappBtn').addEventListener('click', sendWhatsApp);
    document.getElementById('whatsappBtn2').addEventListener('click', sendWhatsApp);

    document.getElementById('clearDayBtn').addEventListener('click', function() {
      const dateStr = document.getElementById('reportDate').value || todayStr();
      const n = getDayData(dateStr).length;
      if (!n) return;
      if (!confirm(`Удалить все ${n} записей за ${formatDate(dateStr)}?`)) return;
      records = records.filter(r => r.date !== dateStr);
      saveRecords();
      render();
      showToast('День очищен');
    });

    render();
  </script>
</body>
</html>
